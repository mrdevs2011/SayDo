name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: APK nomini tayyorlash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/VoiceFlow.apk
          ls -la dist

      - name: APK ni yuklash (Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFlow-apk
          path: dist/VoiceFlow.apk
          if-no-files-found: error

      - name: Release yaratish (faqat v* tag bo'lsa)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VoiceFlow.apk
