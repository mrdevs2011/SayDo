plugins {
    id 'com.android.application'
}

def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) { ksFile.withInputStream { ksProps.load(it) } }

android {
    namespace 'uz.saydo.app'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.saydo.app'
        minSdk 26
        targetSdk 34
        versionCode 29
        versionName '2.16.0'
    }

    signingConfigs {
        release {
            // Parollar kodda saqlanmaydi: muhit o'zgaruvchilari yoki gitga kirmaydigan keystore.properties
            storeFile file(System.getenv('VF_KEYSTORE') ?: ksProps.getProperty('storeFile', '../keystore/saydo.jks'))
            storePassword System.getenv('VF_STORE_PASS') ?: ksProps.getProperty('storePassword')
            keyAlias System.getenv('VF_KEY_ALIAS') ?: ksProps.getProperty('keyAlias', 'voiceflow')
            keyPassword System.getenv('VF_KEY_PASS') ?: ksProps.getProperty('keyPassword')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
