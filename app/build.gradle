plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.voiceflow.app'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.voiceflow.app'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '2.0.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('VF_KEYSTORE') ?: '../keystore/voiceflow.jks')
            storePassword System.getenv('VF_STORE_PASS') ?: 'REMOVED'
            keyAlias System.getenv('VF_KEY_ALIAS') ?: 'voiceflow'
            keyPassword System.getenv('VF_KEY_PASS') ?: 'REMOVED'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
